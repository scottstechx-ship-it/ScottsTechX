<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>News &amp; Events — Kalinabiri Secondary School</title>
  <meta name="description" content="Latest news, events and updates from Kalinabiri Secondary School, Ntinda, Kampala.">
  <link rel="icon" type="image/x-icon" href="/assets/images/logo.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/site-nav.css">
  <script src="/assets/js/site-nav.js" defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(180deg, #0c1829 0%, #0f1f35 100%);
      color: #e2e8f0; min-height: 100vh;
    }
    .page-hero {
      text-align: center; padding: clamp(40px, 8vw, 80px) 20px 30px;
    }
    .page-hero .tag {
      display: inline-block; background: rgba(14,165,233,.15); color: #38bdf8;
      font-size: .78rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      padding: 7px 18px; border-radius: 999px; border: 1px solid rgba(56,189,248,.3); margin-bottom: 16px;
    }
    .page-hero h1 { font-size: clamp(1.9rem, 6vw, 3rem); font-weight: 800; color: #fff; }
    .page-hero h1 span { color: #38bdf8; }
    .page-hero p { color: #94a3b8; margin-top: 10px; font-size: 1.02rem; }

    .news-wrap { max-width: 1100px; margin: 0 auto; padding: 20px clamp(14px, 4vw, 32px) 80px; }
    .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 22px; }
    .news-card {
      background: rgba(16,35,60,.6); border: 1px solid rgba(56,189,248,.15);
      border-radius: 18px; overflow: hidden; display: flex; flex-direction: column;
      transition: transform .25s, box-shadow .25s, border-color .25s;
    }
    .news-card:hover { transform: translateY(-4px); border-color: rgba(56,189,248,.4); box-shadow: 0 18px 44px rgba(2,6,23,.5); }
    .news-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #10233c; display: block; }
    .news-body { padding: 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .news-date { color: #38bdf8; font-size: .8rem; font-weight: 700; display: flex; align-items: center; gap: 7px; }
    .news-title { font-size: 1.15rem; font-weight: 800; color: #fff; line-height: 1.35; }
    .news-text { color: #94a3b8; font-size: .93rem; line-height: 1.6; flex: 1; }
    .news-text.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .news-more {
      align-self: flex-start; background: none; border: none; cursor: pointer;
      color: #38bdf8; font-weight: 700; font-size: .88rem; padding: 4px 0; font-family: inherit;
    }
    .empty {
      text-align: center; padding: 70px 24px; background: rgba(16,35,60,.5);
      border: 1px dashed rgba(56,189,248,.3); border-radius: 18px; color: #94a3b8;
    }
    .empty .big { font-size: 3rem; margin-bottom: 12px; }
    .skeleton { border-radius: 18px; background: rgba(16,35,60,.6); min-height: 320px; position: relative; overflow: hidden; }
    .skeleton::after {
      content: ""; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(56,189,248,.08), transparent);
      animation: sh 1.4s infinite;
    }
    @keyframes sh { 100% { transform: translateX(100%); } }
    footer { text-align: center; color: #64748b; font-size: .85rem; padding: 30px 16px; border-top: 1px solid rgba(56,189,248,.1); }
  </style>
</head>
<body>
  <section class="page-hero">
    <div class="tag">Stay Updated</div>
    <h1>News &amp; <span>Events</span></h1>
    <p>What's happening at Kalinabiri Secondary School</p>
  </section>

  <div class="news-wrap">
    <div class="news-grid" id="newsGrid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </div>

  <footer>© 2026 Kalinabiri Secondary School — Ntinda, Kampala | Developed by <strong>ScottsTechX</strong></footer>

  <script>
    (function () {
      var grid = document.getElementById('newsGrid');
      function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
      function fmtDate(iso) {
        try {
          return new Date((iso || '').replace(' ', 'T') + (iso && iso.length <= 19 ? 'Z' : ''))
            .toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        } catch (e) { return iso || ''; }
      }
      fetch('/api/website/news')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var list = (data && data.news) || [];
          if (!list.length) {
            grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">📰</div><h3>No news yet</h3><p>Check back soon for updates from the school.</p></div>';
            return;
          }
          grid.innerHTML = list.map(function (n) {
            var img = n.image ? '<img class="news-img" src="' + esc(n.image) + '" alt="" loading="lazy" onerror="this.remove()">' : '';
            return '<article class="news-card">' + img +
              '<div class="news-body">' +
                '<div class="news-date"><i class="fas fa-calendar" aria-hidden="true"></i> ' + esc(fmtDate(n.created_at)) + '</div>' +
                '<h2 class="news-title">' + esc(n.title) + '</h2>' +
                '<p class="news-text clamp">' + esc(n.body) + '</p>' +
                '<button class="news-more" type="button">Read more <i class="fas fa-arrow-right"></i></button>' +
              '</div></article>';
          }).join('');
          grid.querySelectorAll('.news-more').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var text = btn.previousElementSibling;
              var open = text.classList.toggle('clamp') === false;
              btn.innerHTML = open ? 'Show less <i class="fas fa-arrow-up"></i>' : 'Read more <i class="fas fa-arrow-right"></i>';
            });
          });
        })
        .catch(function () {
          grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">📡</div><h3>Could not load news</h3><p>Please refresh the page to try again.</p></div>';
        });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — School Portal</title>
<script>try{var t=localStorage.getItem('scp_theme');if(t==='dark'||((!t||t==='system')&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(135deg,#1e3a8a,#2563eb); padding:16px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 25px 60px rgba(2,6,23,.35); width:100%; max-width:420px; padding:32px; }
  .card h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:#64748b; font-size:13.5px; margin-bottom:20px; }
  .err { background:#fee2e2; color:#b91c1c; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:12px; display:none; }
  .ok { background:#dcfce7; color:#15803d; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:12px; display:none; }
  .devlink { background:#fef3c7; border:1px dashed #f59e0b; border-radius:8px; padding:10px 12px; font-size:12.5px; margin-top:12px; word-break:break-all; display:none; }
  .back { text-align:center; margin-top:16px; font-size:13px; }
</style>
</head>
<body>
<div class="card">
  <h1>🔑 Forgot your password?</h1>
  <div class="sub">Enter the email address linked to your account and we'll send you a reset link.</div>
  <div class="err" id="err"></div>
  <div class="ok" id="ok"></div>
  <form id="fp-form">
    <label class="field">Email address
      <input type="email" id="email" placeholder="you@school.com" required>
    </label>
    <button class="btn block" type="submit" id="fp-btn" style="padding:12px">Send reset link</button>
  </form>
  <div class="devlink" id="devlink"><strong>Development mode — no email server configured.</strong><br>Your reset link: <a id="devlink-a" href="#">open here</a></div>
  <div class="back"><a href="login.html">← Back to sign in</a></div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script>
  document.getElementById('fp-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const err = document.getElementById('err');
    const ok = document.getElementById('ok');
    const dev = document.getElementById('devlink');
    err.style.display = ok.style.display = dev.style.display = 'none';
    const btn = document.getElementById('fp-btn');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const data = await API.post('/api/auth/forgot-password', { email: document.getElementById('email').value.trim() });
      ok.textContent = data.message || 'If that email is registered, a reset link has been sent.';
      ok.style.display = 'block';
      if (data.devLink) {
        document.getElementById('devlink-a').href = data.devLink;
        document.getElementById('devlink-a').textContent = data.devLink;
        dev.style.display = 'block';
      }
    } catch (ex) {
      err.textContent = ex.message;
      err.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = 'Send reset link';
  });
</script>
</body>
</html>

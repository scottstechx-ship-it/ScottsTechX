<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — School Portal</title>
<script>try{var t=localStorage.getItem('scp_theme');if(t==='dark'||((!t||t==='system')&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(135deg,#1e3a8a,#2563eb); padding:16px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 25px 60px rgba(2,6,23,.35); width:100%; max-width:420px; padding:32px; }
  .card h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:#64748b; font-size:13.5px; margin-bottom:20px; }
  .err { background:#fee2e2; color:#b91c1c; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:12px; display:none; }
  .ok { background:#dcfce7; color:#15803d; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:12px; display:none; }
  .back { text-align:center; margin-top:16px; font-size:13px; }
</style>
</head>
<body>
<div class="card">
  <h1>🔑 Choose a new password</h1>
  <div class="sub">Enter a new password for your account (min 8 characters, at least one letter and one number).</div>
  <div class="err" id="err"></div>
  <div class="ok" id="ok"></div>
  <form id="rp-form">
    <label class="field">New password
      <input type="password" id="pw" autocomplete="new-password" required>
    </label>
    <label class="field">Confirm new password
      <input type="password" id="pw2" autocomplete="new-password" required>
    </label>
    <button class="btn block" type="submit" id="rp-btn" style="padding:12px">Reset password</button>
  </form>
  <div class="back"><a href="login.html">← Back to sign in</a></div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script>
  (function () {
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    if (!token) {
      document.getElementById('err').textContent = 'This reset link is missing its token. Request a new one.';
      document.getElementById('err').style.display = 'block';
      document.getElementById('rp-form').querySelector('button').disabled = true;
      return;
    }
    document.getElementById('rp-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const err = document.getElementById('err');
      const ok = document.getElementById('ok');
      err.style.display = ok.style.display = 'none';
      const pw = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;
      if (pw !== pw2) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }
      const btn = document.getElementById('rp-btn');
      btn.disabled = true; btn.textContent = 'Resetting…';
      try {
        await API.post('/api/auth/reset-password', { token, newPassword: pw });
        ok.textContent = 'Your password has been reset. You can now log in.';
        ok.style.display = 'block';
        setTimeout(function () { location.href = 'login.html'; }, 1800);
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Reset password';
      }
    });
  })();
</script>
</body>
</html>

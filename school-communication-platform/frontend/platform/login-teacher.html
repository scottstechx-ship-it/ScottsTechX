<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teacher Sign in — Kalinabiri SS</title>
<link rel="stylesheet" href="login-premium.css">
<style>
:root {
  --role-bg-1: #1c1208;
  --role-bg-2: #0d0803;
  --role-accent: #f59e0b;
  --role-accent-2: #d97706;
  --role-glow: rgba(245, 158, 11, 0.4);
  --role-glow-2: rgba(217, 119, 6, 0.3);
  --role-card-border: rgba(245, 158, 11, 0.3);
  --role-input-focus: #f59e0b;
  --role-input-focus-glow: rgba(245, 158, 11, 0.15);
  --role-badge-bg: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(217,119,6,0.15));
  --role-badge-border: rgba(245, 158, 11, 0.3);
  --role-badge-color: #fde68a;
  --icon-wrapper-bg: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(217,119,6,0.1));
  --icon-wrapper-border: rgba(245, 158, 11, 0.25);
  --btn-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  --btn-shadow: rgba(245, 158, 11, 0.4);
  --footer-color: rgba(245, 158, 11, 0.5);
}
.login-page { background: var(--role-bg-1); }
.orb { background: radial-gradient(circle at 30% 30%, #f59e0b 0%, #b45309 50%, transparent 70%); }
.orb:nth-child(2) { background: radial-gradient(circle at 70% 70%, #d97706 0%, #92400e 50%, transparent 70%); }
.grid-overlay { background-image: linear-gradient(rgba(245,158,11,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(245,158,11,0.03) 1px, transparent 1px); }
</style>
</head>
<body class="login-page role-teacher">
<a href="/" class="kn-back" aria-label="Back to school website">← School website</a>
<style>
.kn-back { position: fixed; top: 14px; left: 14px; z-index: 50; display: inline-flex; align-items: center; gap: 6px;
  color: rgba(255,255,255,.85); text-decoration: none; font-weight: 700; font-size: .84rem; font-family: 'Inter', system-ui, sans-serif;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 9px 16px;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: background .2s; }
.kn-back:hover { background: rgba(255,255,255,.18); }
.pw-toggle-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: rgba(255,255,255,.55); font-size: 1rem;
  padding: 9px; border-radius: 9px; min-width: 40px; min-height: 40px; z-index: 2; }
.pw-toggle-btn:hover { color: #fff; background: rgba(255,255,255,.1); }
.input-wrapper input[type="password"], .input-wrapper input[type="text"] { padding-right: 48px !important; }
@media (max-width: 560px) {
  .login-card { padding: 26px 20px !important; }
  .kn-back { top: 10px; left: 10px; }
}
</style>

<div class="bg-layer"></div>
<div class="orb" style="top:8%;left:6%;animation-duration:26s;"></div>
<div class="orb" style="bottom:8%;right:6%;animation-duration:20s;"></div>
<div class="grid-overlay"></div>
<div class="ring" aria-hidden="true"></div>

<main class="login-stage" role="main">
  <div class="login-card" id="loginCard">
    <div class="role-badge" aria-label="Teacher portal">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <span>Teacher Portal</span>
    </div>
    <div class="icon-wrapper" aria-hidden="true">
      <img src="/assets/images/logo.png" alt="Kalinabiri SS" style="width:48px;height:48px;border-radius:12px;object-fit:cover;border:2px solid rgba(245,158,11,0.3);">
    </div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Teacher Dashboard</p>

    <form id="loginForm" novalidate>
      <div class="input-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter username" required aria-describedby="usernameHint">
        </div>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter password" required aria-describedby="passwordHint">
        </div>
      </div>
      <div class="form-options">
        <label class="remember-me"><input type="checkbox" name="remember" value="1"> Remember me</label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn"><span class="btn-text">Sign In</span><span class="btn-loader" aria-hidden="true"></span></button>
      <p id="formMessage" class="form-message" aria-live="polite"></p>
    </form>

    <p class="footer-note">Kalinabiri Secondary School • Ntinda, Kampala</p>
  </div>
</main>
<script src="login-premium.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('formMessage');
  const btn = document.getElementById('submitBtn');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const body = Object.fromEntries(fd);
    btn.disabled = true; btn.querySelector('.btn-text').textContent = 'Signing in…'; btn.classList.add('loading');
    msg.textContent = ''; msg.className = 'form-message';
    try {
      const res = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      localStorage.setItem('scp_token', data.token);
      localStorage.setItem('scp_user', JSON.stringify(data.user));
      msg.textContent = 'Redirecting…'; msg.className = 'form-message success';
      setTimeout(() => window.location.href = '/teacher/', 600);
    } catch (err) {
      msg.textContent = err.message; msg.className = 'form-message error';
      btn.disabled = false; btn.querySelector('.btn-text').textContent = 'Sign In'; btn.classList.remove('loading');
    }
  });
});
</script>
<script>
(function () {
  var pw = document.getElementById('password');
  if (!pw) return;
  var wrap = pw.closest('.input-wrapper');
  if (!wrap) return;
  wrap.style.position = 'relative';
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'pw-toggle-btn';
  btn.setAttribute('aria-label', 'Show password');
  btn.textContent = '👁';
  btn.addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    btn.textContent = show ? '🙈' : '👁';
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
  wrap.appendChild(btn);
})();
</script>
</body>
</html>

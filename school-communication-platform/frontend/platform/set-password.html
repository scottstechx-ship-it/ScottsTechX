<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set your password — School Portal</title>
<link rel="stylesheet" href="css/app.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(135deg,#1e3a8a,#2563eb); padding:16px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 25px 60px rgba(2,6,23,.35); width:100%; max-width:420px; padding:32px; }
  .card h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:#64748b; font-size:13.5px; margin-bottom:20px; }
  .err { background:#fee2e2; color:#b91c1c; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:12px; display:none; }
  .back { text-align:center; margin-top:16px; font-size:13px; }
</style>
</head>
<body>
<div class="card">
  <h1>🔑 Choose your own password</h1>
  <div class="sub">Your account was created with a temporary password. Please set a personal one now (min 8 characters, at least one letter and one number).</div>
  <div class="err" id="err"></div>
  <form id="sp-form">
    <label class="field">New password
      <input type="password" id="pw" autocomplete="new-password" required>
    </label>
    <label class="field">Confirm new password
      <input type="password" id="pw2" autocomplete="new-password" required>
    </label>
    <button class="btn block" type="submit" id="sp-btn" style="padding:12px">Save password</button>
  </form>
  <div class="back"><a href="login.html">Log out and sign in differently</a></div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script>
  (function () {
    const ROLE_HOME = { super_admin: 'super-admin', admin: 'admin', teacher: 'teacher', student: 'student', parent: 'parent' };
    // Must be logged in to set a password
    if (!API.getToken() || !API.getUser()) {
      location.href = 'login.html';
      return;
    }
    document.getElementById('sp-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const err = document.getElementById('err');
      err.style.display = 'none';
      const pw = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;
      if (pw !== pw2) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }
      const btn = document.getElementById('sp-btn');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await API.post('/api/auth/set-password', { newPassword: pw });
        const user = API.getUser();
        user.mustChangePassword = false;
        API.setUser(user);
        window.UI && window.UI.toast('Password saved!', 'success');
        location.href = (ROLE_HOME[user.role] || 'student') + '/index.html';
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Save password';
      }
    });
  })();
</script>
</body>
</html>

            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-dark) 100%);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;

        #three-canvas {

            top: 0;
            left: 0;
            width: 100%;

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 0.75rem 2rem;
            display: flex;
            align-items: center;

        .logo-container {

            height: 48px;
            perspective: 500px;
        }

        .logo-3d {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: logoFloat 4s ease-in-out infinite;
        }

        .logo-3d img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);

        @keyframes logoFloat {

            color: var(--accent);

            gap: 2rem;

        .nav-links a {

        .video-card {
                    background: linear-gradient(135deg, rgba(14, 165, 233, 0.18) 0%, rgba(2, 132, 199, 0.10) 100%);
                    border-radius: 16px;

                        transform 0.7s cubic-bezier(.2,.7,.2,1),
                        box-shadow 0.4s ease,
                        border-color 0.3s ease;
                    opacity: 0;
                    transform: translateY(48px) scale(0.96);
                    will-change: transform, opacity;
                }

                    box-shadow: 0 18px 44px rgba(14, 165, 233, 0.35);

                @media (prefers-reduced-motion: reduce) {
                    .video-card { transform: none; transition: opacity 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; }
                    .video-card.visible, .video-card.visible:hover { transform: none; }
                }

        .video-thumbnail {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
        }

        .video-thumbnail video {
            width: 100%;

        .play-overlay {
            position: absolute;
            inset: 0;

            justify-content: center;

        .play-overlay::before {

        /* Image Gallery */
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
        }

        @media (max-width: 1000px) {

        @media (max-width: 700px) {
            .image-gallery { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 500px) {
            .image-gallery { grid-template-columns: 1fr; }
        }

        /* Image card scroll-reveal animation — fade up + scale in.
           Blue-family gradients give each card a unique tint while keeping
           the overall theme cohesive (all blues/cyans/teals, no greens/
           pinks/oranges). The :nth-child rules pick a gradient by index. */
                .image-card {
                    aspect-ratio: 4/3;
                    border-radius: 16px;
                    overflow: hidden;
                    position: relative;
                    cursor: pointer;
                    transform-style: preserve-3d;
                    opacity: 0;
                    transform: translateY(48px) scale(0.96);
                    transition:
                        opacity 0.7s cubic-bezier(.2,.7,.2,1),
                        transform 0.7s cubic-bezier(.2,.7,.2,1),
                        box-shadow 0.4s ease;
                    will-change: transform, opacity;
                }

                .image-card.visible {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }

                .image-card.visible:hover {
                    transform: translateY(-4px) scale(1.02);
                    box-shadow: 0 16px 40px rgba(14, 165, 233, 0.25);
                    z-index: 2;
                }

                .image-card::before { content: none; }

                /* Reveal direction: cards from even positions slide up; odd
                   positions slide in from a tiny horizontal offset. This
                   breaks the "everything fades up identically" monotony. */
                .image-card:nth-child(odd) { transform: translateY(48px) scale(0.96) rotate(-1.2deg); }
                .image-card:nth-child(odd).visible { transform: translateY(0) scale(1) rotate(0deg); }
                .image-card:nth-child(odd).visible:hover { transform: translateY(-4px) scale(1.02) rotate(0deg); }
                .image-card:nth-child(even) { transform: translateY(48px) scale(0.96); }
                .image-card:nth-child(even).visible { transform: translateY(0) scale(1); }
                .image-card:nth-child(even).visible:hover { transform: translateY(-4px) scale(1.02); }

                @media (prefers-reduced-motion: reduce) {
                    .image-card { transform: none; transition: opacity 0.3s ease; }
                    .image-card:nth-child(odd) { transform: none; }
                    .image-card.visible { transform: none; }
                    .image-card.visible:hover { transform: none; }
                }

        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 1rem;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            z-index: 2;
        }

            margin-bottom: 0.25rem;

        /* Modal / Lightbox */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0,0,0,0.95);
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 1000px;
        }

        .modal-video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
        }

        .modal-video video {
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;

        /* Lightbox for images */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0,0,0,0.95);
            align-items: center;
            justify-content: center;

        .lightbox.active {

        }

        .lightbox-content {
            width: 90%;
            max-width: 900px;
            aspect-ratio: 4/3;
            border-radius: 16px;
            position: relative;
        }

        .lightbox-close {
            position: absolute;
            top: -50px;
            right: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-gradient {
            width: 100%;
            height: 100%;
            border-radius: 16px;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .lightbox-nav:hover {
            background: var(--accent);
            color: var(--primary-dark);
        }

        .lightbox-prev { left: -70px; }
        .lightbox-next { right: -70px; }

            .lightbox-next { right: 10px; }

/* Animations */
        @keyframes fadeInUp {

        /* Memorial Gallery */
        .memorial-gallery {

        .memorial-gallery .section-header {

        .memorial-gallery .section-header h2 {

        .memorial-grid {
            display: grid;

        }

        .memorial-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;

            opacity: 0;

        .memorial-item:nth-child(1) { animation-delay: 0.1s; }

        .memorial-item:nth-child(8) { animation-delay: 0.8s; }

        .memorial-item:hover {

        <button class="lightbox-nav lightbox-next" onclick="nextImage()">&#9654;</button>
    </div>

    <script>
window.addEventListener("load", function() { setTimeout(function() {
if (!window.THREE || window.innerWidth < 768) return;

        // Three.js Background
        const canvas = document.getElementById('three-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Create floating particles
        const particleCount = 200;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 20;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
            
            colors[i * 3] = 0.29;
            colors[i * 3 + 1] = 0.87;
            colors[i * 3 + 2] = 0.5;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.6
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // Add some floating cubes
        const cubeGeometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        const cubeMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x4ade80, 
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });

        const cubes = [];
        for (let i = 0; i < 15; i++) {
            const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
            cube.position.set(
                (Math.random() - 0.5) * 15,
                (Math.random() - 0.5) * 15,
                (Math.random() - 0.5) * 15
            );
            cube.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            cubes.push(cube);
            scene.add(cube);
        }

        camera.position.z = 5;

        let mouseX = 0, mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        function animate() {
            requestAnimationFrame(animate);

            particles.rotation.y += 0.0005;
            particles.rotation.x += 0.0002;

            cubes.forEach((cube, i) => {
                cube.rotation.x += 0.005 * (i % 3 + 1);
                cube.rotation.y += 0.003 * (i % 2 + 1);
                cube.position.y += Math.sin(Date.now() * 0.001 + i) * 0.001;
            });

            camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 0.5 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Mobile Menu
        function toggleMenu() {
            document.querySelector('.nav-links').classList.toggle('active');
        }

        // Image Lightbox
        const imageCards = document.querySelectorAll('.image-card');
        const lightbox = document.getElementById('lightbox');
        const lightboxGradient = document.getElementById('lightboxGradient');
        let currentImageIndex = 0;

        const gradients = [
            'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
            'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
            'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
            'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
            'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
            'linear-gradient(135deg, #d299c2 0%, #fef9d7 100%)',
            'linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%)',
            'linear-gradient(135deg, #fddb92 0%, #d1fdff 100%)',
            'linear-gradient(135deg, #c1dfc4 0%, #deecdd 100%)',
            'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
            'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)'
        ];

        imageCards.forEach((card, index) => {
            card.addEventListener('click', () => {
                currentImageIndex = index;
                openLightbox(index);
            });

            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = (y - centerY) / 20;
                const rotateY = (centerX - x) / 20;
                
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
            });
        });

        function openLightbox(index) {
            lightboxGradient.style.background = gradients[index];
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % 12;
            lightboxGradient.style.background = gradients[currentImageIndex];
        }

        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + 12) % 12;
            lightboxGradient.style.background = gradients[currentImageIndex];
        }

        // Close modals on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeLightbox();
            }
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
        });

        // Intersection Observer for scroll animations
                // Each card is tagged with --card-index up-front so the stagger
                // animation uses the card's DOM index, not the observer's batch
                // index (which is always 0 for cards that cross together).
                const allCards = document.querySelectorAll('.video-card, .image-card');
                allCards.forEach((card, i) => card.style.setProperty('--card-index', i));

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            const i = parseInt(entry.target.style.getPropertyValue('--card-index'), 10) || 0;
                            // Stagger by column: cards in the same row (~3 across)
                            // animate together; rows stagger by 120ms.
                            const delay = Math.floor(i / 3) * 120 + (i % 3) * 40;
                            setTimeout(() => {
                                entry.target.classList.add('visible');
                            }, delay);
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

                allCards.forEach(card => observer.observe(card));
    
    // Mobile Menu Toggle
    function toggleMobileMenu() {
      var nl = document.getElementById('navLinks');
      var mb = document.getElementById('mobileBtn');
      if (nl) nl.classList.toggle('mobile-open');
      if (mb) mb.classList.toggle('active');
    }


}, 400); });
</script>
<script>
// Live managed gallery — ALL photos and videos come from the school's
// managed gallery (dashboard -> Website Gallery). Deleting an item there
// removes it here instantly.
(function () {
  function esc(x) { var d = document.createElement('div'); d.textContent = x == null ? '' : String(x); return d.innerHTML; }

  fetch('/api/website/gallery').then(function (r) { return r.json(); }).then(function (data) {
    var imgs = (data && data.images) || [];
    var vids = (data && data.videos) || [];

    // ---- PHOTOS ----
    var grid = document.getElementById('managedGallery');
    if (grid) {
      if (!imgs.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#94a3b8">📷 No photos yet — the school will add them soon.</div>';
      } else {
        grid.innerHTML = imgs.map(function (im, i) {
          return '<div class="image-card visible" data-index="' + i + '">' +
            '<img src="' + esc(im.src) + '" alt="' + esc(im.title) + '" loading="lazy">' +
            '<div class="image-overlay"><h3>' + esc(im.title) + '</h3><span>' + esc(im.category || im.caption || '') + '</span></div></div>';
        }).join('');
        grid.querySelectorAll('.image-card').forEach(function (card, i) {
          card.style.cursor = 'zoom-in';
          card.addEventListener('click', function () {
            var ov = document.createElement('div');
            ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(2,6,23,.94);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out';
            ov.innerHTML = '<img src="' + esc(imgs[i].src) + '" alt="" style="max-width:96vw;max-height:88vh;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)">';
            ov.addEventListener('click', function () { ov.remove(); document.body.style.overflow = ''; });
            document.body.appendChild(ov);
            document.body.style.overflow = 'hidden';
          });
        });
      }
    }
  }).catch(function () { /* photos stay static on error */ });
})();
</script>
